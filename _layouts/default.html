<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 8vh 6vw 12vh; max-width: 42rem; margin-inline: auto;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #201e1d; background: #f6f0e6;
    }
    a { color: #3d4b8f; }
    @media (prefers-color-scheme: dark) { body { color: #f3ede3; background: #22211f; } a { color: #adb7e6; } }
    nav { font-size: .9rem; opacity: .7; margin-bottom: 2.5rem; }
    nav a { text-decoration: none; }
    h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 .5rem; }
    h2 { font-size: 1.15rem; margin: 2.25rem 0 .6rem; }
    p, li { margin: 0 0 .8rem; }
    ul { padding-left: 1.2rem; }
    strong { font-weight: 600; }
    footer { margin-top: 4rem; font-size: .85rem; opacity: .55; }
  </style>
</head>
<body>
  <nav><a href="/">Sarang Studio</a></nav>
  <main>
    {{ content }}
  </main>
  <footer>© 2026 Sarang Studio</footer>
</body>
</html>
