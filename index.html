<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarang Studio</title>
  <meta name="description" content="Sarang Studio makes small, private apps for iPhone.">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 12vh 6vw; max-width: 40rem; margin-inline: auto;
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #201e1d; background: #f6f0e6;
    }
    @media (prefers-color-scheme: dark) { body { color: #f3ede3; background: #22211f; } a { color: #adb7e6; } }
    h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
    p.lede { margin: 0 0 2.5rem; opacity: .75; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: 2rem 0 .75rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: .9rem 0; border-top: 1px solid rgba(128,128,128,.25); }
    li:last-child { border-bottom: 1px solid rgba(128,128,128,.25); }
    .app { font-weight: 600; }
    .links { font-size: .95rem; opacity: .85; }
    .links a { margin-right: 1rem; }
    a { color: #3d4b8f; }
    footer { margin-top: 3rem; font-size: .85rem; opacity: .55; }
  </style>
</head>
<body>
  <h1>Sarang Studio</h1>
  <p class="lede">Small, private apps for iPhone. Everything stays on your device.</p>

  <h2>Apps</h2>
  <ul>
    <li>
      <div class="app">Daylog</div>
      <div>A life record that fills itself in from what your phone already knows.</div>
      <div class="links">
        <a href="/daylog/privacy/">Privacy policy</a>
        <a href="https://github.com/sarang-studio/sarang-studio.github.io/issues">Support</a>
      </div>
    </li>
  </ul>

  <footer>© 2026 Sarang Studio</footer>
</body>
</html>
